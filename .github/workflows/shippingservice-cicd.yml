name: Shipping Service CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Required for checkout and GitHub OIDC authentication to AWS
permissions:
  contents: read
  id-token: write

# Do not allow two Shipping deployments on the same branch at once
concurrency:
  group: shippingservice-${{ github.ref }}
  cancel-in-progress: false

# Common Shipping Service configuration
env:
  SERVICE_NAME: shippingservice

  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "663130434910"
  ECR_REPOSITORY: boutique-shippingservice-java
  EKS_CLUSTER_NAME: boutique-dev-eks

  K8S_NAMESPACE: boutique
  K8S_DEPLOYMENT: shippingservice
  K8S_SERVICE: shippingservice
  SERVICE_PORT: "8087"

  HELM_RELEASE: shippingservice-dev
  PLATFORM_REPOSITORY: skmohinudd/boutique-platform-infra
  HELM_CHART_PATH: boutique-platform-infra/helm/shippingservice

  SONAR_HOST_URL: http://44.199.205.21:9000
  SONAR_PROJECT_KEY: boutique-shippingservice
  SONAR_PROJECT_NAME: Boutique Shipping Service


jobs:

  # Pull requests run tests and Sonar only
  pr-validation:
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Fix Windows line endings and Maven wrapper permissions
      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Run tests
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean test

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="$SONAR_PROJECT_NAME" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"


  # Main pipeline: Maven → Sonar → Nexus → ECR → Helm → EKS
  deploy-main:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Shipping Service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      # Same immutable version is used by Nexus, ECR, Helm and EKS
      - name: Generate application version
        run: |
          APP_VERSION="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "JAR_NAME=shippingservice-$APP_VERSION.jar" >> "$GITHUB_ENV"

          echo "Application version: $APP_VERSION"

      # Fail early if an important GitHub secret is missing
      - name: Validate required secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          AWS_GITHUB_ROLE_ARN: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
        run: |
          for NAME in \
            SONAR_TOKEN \
            NEXUS_USERNAME \
            NEXUS_PASSWORD \
            AWS_GITHUB_ROLE_ARN
          do
            if [ -z "${!NAME}" ]; then
              echo "Missing required secret: $NAME"
              exit 1
            fi
          done

      # Apply the generated CI version to Maven
      - name: Set Maven version
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            versions:set \
            -DnewVersion="$APP_VERSION" \
            -DgenerateBackupPoms=false

      # Test and create the versioned Shipping JAR
      - name: Test and build JAR
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean package

          test -f "target/$JAR_NAME"

          echo "JAR created: $JAR_NAME"

      # Analyze the exact version that will be deployed
      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="$SONAR_PROJECT_NAME" \
            -Dsonar.projectVersion="$APP_VERSION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # Publish the versioned JAR to Nexus
      - name: Publish JAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            deploy \
            -DskipTests

      # Authenticate GitHub to AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: shippingservice-${{ github.run_id }}
          allowed-account-ids: "663130434910"

      # Verify that the workflow is using the expected AWS account and ECR repo
      - name: Validate AWS and ECR
        run: |
          ACCOUNT="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [ "$ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo "Expected AWS account: $AWS_ACCOUNT_ID"
            echo "Actual AWS account  : $ACCOUNT"
            exit 1
          fi

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            > /dev/null

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build the Shipping image with the same application version
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_REPOSITORY="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${APP_VERSION}"

          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          docker build \
            --label "org.opencontainers.image.version=$APP_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_URI" \
            .

      # Trivy remains disabled until the existing scan/cache issue is fixed

      - name: Push image to ECR
        run: |
          docker push "$IMAGE_URI"

      # Verify the pushed image and capture its immutable digest
      - name: Validate ECR image
        run: |
          IMAGE_DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$APP_VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "Shipping image was not found in ECR"
            exit 1
          fi

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0

      # Checkout the central Helm repository used by all services
      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          path: boutique-platform-infra
          persist-credentials: false

      # Catch chart/template problems before connecting the release to EKS
      - name: Validate Helm chart
        run: |
          helm lint "$HELM_CHART_PATH"

          helm template \
            "$HELM_RELEASE" \
            "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            > /dev/null

      # Configure kubectl for the Boutique EKS cluster
      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            > /dev/null

          test "$(kubectl auth can-i get deployments \
            -n "$K8S_NAMESPACE")" = "yes"

          test "$(kubectl auth can-i patch deployments \
            -n "$K8S_NAMESPACE")" = "yes"

      # Shipping requires PostgreSQL credentials, Kafka and RabbitMQ
      - name: Validate Shipping dependencies
        run: |
          kubectl get svc kafka \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          kubectl get svc rabbitmq \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          kubectl get secret boutique-rds-credentials \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          kubectl get secret rabbitmq-credentials \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          kubectl get secretproviderclass boutique-rds-secrets \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          echo "Shipping dependencies verified"

      # Refuse deployment while a previous Helm operation is unfinished
      - name: Check Helm release state
        run: |
          STATUS="$(helm status "$HELM_RELEASE" \
            -n "$K8S_NAMESPACE" \
            -o json \
            2>/dev/null \
            | jq -r '.info.status // "not-installed"' \
            || echo "not-installed")"

          case "$STATUS" in
            pending-install|pending-upgrade|pending-rollback)
              echo "Helm release is stuck: $STATUS"
              exit 1
              ;;
          esac

      # Deploy the exact ECR image through the central Shipping Helm chart
      - name: Deploy Shipping Service with Helm
        run: |
          helm upgrade --install \
            "$HELM_RELEASE" \
            "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            --atomic \
            --cleanup-on-fail \
            --history-max 5 \
            --wait \
            --timeout 5m

      # Confirm Kubernetes successfully completed the new rollout
      - name: Validate Kubernetes rollout
        run: |
          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

      # Verify EKS is running the exact image produced by this workflow
      - name: Validate deployed image and replicas
        run: |
          DEPLOYED_IMAGE="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          READY="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}')"

          DESIRED="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"

          if [ "$DEPLOYED_IMAGE" != "$IMAGE_URI" ]; then
            echo "Expected image: $IMAGE_URI"
            echo "Running image : $DEPLOYED_IMAGE"
            exit 1
          fi

          if [ "${READY:-0}" != "$DESIRED" ]; then
            echo "Ready replicas: ${READY:-0}/${DESIRED}"
            exit 1
          fi

          echo "Image verified: $DEPLOYED_IMAGE"
          echo "Ready replicas: $READY/$DESIRED"

      # Test the Kubernetes Service and Spring Boot health endpoint
      - name: Validate Shipping Service health
        run: |
          ENDPOINTS="$(kubectl get endpointslice \
            -n "$K8S_NAMESPACE" \
            -l kubernetes.io/service-name="$K8S_SERVICE" \
            -o jsonpath='{range .items[*].endpoints[*]}{.addresses[0]}{" "}{end}')"

          if [ -z "$ENDPOINTS" ]; then
            echo "Shipping Service has no ready endpoints"
            exit 1
          fi

          TEST_POD="shipping-health-${GITHUB_RUN_ID}"

          cleanup() {
            kubectl delete pod "$TEST_POD" \
              -n "$K8S_NAMESPACE" \
              --ignore-not-found \
              > /dev/null 2>&1 || true
          }

          trap cleanup EXIT

          kubectl run "$TEST_POD" \
            -n "$K8S_NAMESPACE" \
            --restart=Never \
            --image=curlimages/curl \
            --command -- \
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              "http://${K8S_SERVICE}:${SERVICE_PORT}/actuator/health" \
            > /dev/null

          kubectl wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/"$TEST_POD" \
            -n "$K8S_NAMESPACE" \
            --timeout=90s \
            > /dev/null

          HEALTH="$(kubectl logs "$TEST_POD" \
            -n "$K8S_NAMESPACE")"

          echo "$HEALTH"

          if ! echo "$HEALTH" | grep -q '"status":"UP"'; then
            echo "Shipping Service health check failed"
            exit 1
          fi

          echo "Shipping Service health: UP"

      # Show only the important deployment identities
      - name: Deployment summary
        run: |
          echo "Shipping Service deployment completed"
          echo "Version : $APP_VERSION"
          echo "JAR     : $JAR_NAME"
          echo "Image   : $IMAGE_URI"
          echo "Digest  : $IMAGE_DIGEST"
          echo "Helm    : $HELM_RELEASE"