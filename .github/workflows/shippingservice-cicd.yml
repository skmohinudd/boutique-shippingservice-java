name: Shipping Service CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for repository access and GitHub OIDC authentication to AWS
permissions:
  contents: read
  id-token: write

# Prevent multiple deployments of the same branch from colliding
concurrency:
  group: shippingservice-${{ github.ref }}
  cancel-in-progress: false

# Common Shipping Service, AWS, Kubernetes, Helm and Sonar settings
env:
  SERVICE_NAME: shippingservice

  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "663130434910"
  ECR_REPOSITORY: boutique-shippingservice-java
  EKS_CLUSTER_NAME: boutique-dev-eks

  K8S_NAMESPACE: boutique
  K8S_DEPLOYMENT: shippingservice
  K8S_SERVICE: shippingservice
  SERVICE_PORT: "8087"

  HELM_RELEASE: shippingservice-dev
  PLATFORM_REPOSITORY: skmohinudd/boutique-platform-infra
  HELM_CHART_PATH: boutique-platform-infra/helm/shippingservice

  SONAR_HOST_URL: http://44.199.205.21:9000
  SONAR_PROJECT_KEY: boutique-shippingservice
  SONAR_PROJECT_NAME: Boutique Shipping Service


jobs:

  # PR validates code and quality only; nothing is deployed
  pr-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 21 with Maven dependency caching
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Fix Windows line endings and allow Maven wrapper execution
      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      # Run Shipping Service tests using Nexus
      - name: Run tests
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean test

      # Send code-quality analysis to SonarQube
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="$SONAR_PROJECT_NAME" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"


  # Main pipeline: JAR → Nexus → Docker → ECR → Helm → EKS
  deploy-main:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      # One immutable version is reused across JAR, ECR and Helm
      - name: Generate application version
        run: |
          APP_VERSION="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "JAR_NAME=shippingservice-$APP_VERSION.jar" >> "$GITHUB_ENV"

          echo "Shipping version: $APP_VERSION"

      # Fail early when a required GitHub secret is missing
      - name: Validate required secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          AWS_GITHUB_ROLE_ARN: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
        run: |
          for NAME in \
            SONAR_TOKEN \
            NEXUS_USERNAME \
            NEXUS_PASSWORD \
            AWS_GITHUB_ROLE_ARN
          do
            if [ -z "${!NAME}" ]; then
              echo "Missing required secret: $NAME"
              exit 1
            fi
          done

          echo "Required secrets verified"

      # Apply the CI-generated version to Maven
      - name: Set Maven version
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            versions:set \
            -DnewVersion="$APP_VERSION" \
            -DgenerateBackupPoms=false

      # Test and create the versioned Shipping Service JAR
      - name: Build JAR
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            clean package

          test -f "target/$JAR_NAME"

          echo "JAR created: $JAR_NAME"

      # Analyze the exact application version being deployed
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="$SONAR_PROJECT_NAME" \
            -Dsonar.projectVersion="$APP_VERSION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # Store the versioned JAR in Nexus
      - name: Publish JAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -s .mvn/nexus-settings.xml \
            deploy \
            -DskipTests

      # GitHub OIDC assumes the AWS deployment role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: shippingservice-${{ github.run_id }}
          allowed-account-ids: "663130434910"

      # Verify the expected AWS account and ECR repository
      - name: Validate AWS and ECR
        run: |
          ACCOUNT="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "AWS and ECR verified"

      # Authenticate Docker to Amazon ECR
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build the immutable Shipping Service container image
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_REPOSITORY="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${APP_VERSION}"

          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          docker build \
            --label "org.opencontainers.image.version=$APP_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_URI" \
            .

      # Trivy is temporarily disabled until the scan/cache issue is fixed

      # Push the immutable image to ECR
      - name: Push image to ECR
        run: |
          docker push "$IMAGE_URI"

      # Confirm the pushed image exists and capture its digest
      - name: Validate ECR image
        run: |
          IMAGE_DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$APP_VERSION" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          test -n "$IMAGE_DIGEST"
          test "$IMAGE_DIGEST" != "None"

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0

      # Get the central Shipping Service Helm chart
      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPOSITORY }}
          path: boutique-platform-infra
          persist-credentials: false

      # Catch Helm syntax/rendering errors before touching EKS
      - name: Validate Helm chart
        run: |
          helm lint "$HELM_CHART_PATH"

          helm template "$HELM_RELEASE" "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            > /tmp/shippingservice.yaml

          test -s /tmp/shippingservice.yaml

      # Connect kubectl to the Boutique EKS cluster
      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            > /dev/null

          test "$(kubectl auth can-i get deployments \
            -n "$K8S_NAMESPACE")" = "yes"

          test "$(kubectl auth can-i patch deployments \
            -n "$K8S_NAMESPACE")" = "yes"

      # Shipping requires PostgreSQL credentials, Kafka and RabbitMQ
      - name: Validate runtime dependencies
        run: |
          kubectl get svc kafka \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          kubectl get svc rabbitmq \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          kubectl get secret boutique-rds-credentials \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          kubectl get secret rabbitmq-credentials \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          kubectl get secretproviderclass boutique-rds-secrets \
            -n "$K8S_NAMESPACE" \
            > /dev/null

          echo "Shipping dependencies verified"

      # Stop deployment if another Helm operation is unfinished
      - name: Check Helm release state
        run: |
          STATUS="$(helm status "$HELM_RELEASE" \
            -n "$K8S_NAMESPACE" \
            -o json \
            2>/dev/null \
            | jq -r '.info.status // "not-installed"' \
            || echo "not-installed")"

          case "$STATUS" in
            pending-install|pending-upgrade|pending-rollback)
              echo "Helm release is stuck: $STATUS"
              exit 1
              ;;
          esac

      # Helm is the deployment source of truth for Shipping Service
      - name: Deploy with Helm
        run: |
          helm upgrade --install \
            "$HELM_RELEASE" \
            "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="$APP_VERSION" \
            --atomic \
            --cleanup-on-fail \
            --history-max 5 \
            --wait \
            --timeout 5m

      # Wait until the new Shipping pods become Ready
      - name: Validate rollout
        run: |
          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

      # Confirm EKS is running the exact image built by this workflow
      - name: Validate deployed image
        run: |
          DEPLOYED_IMAGE="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          if [ "$DEPLOYED_IMAGE" != "$IMAGE_URI" ]; then
            echo "Expected: $IMAGE_URI"
            echo "Running : $DEPLOYED_IMAGE"
            exit 1
          fi

          echo "Deployed image verified"

      # Call Spring Boot actuator from inside the Shipping pod
      - name: Validate application health
        run: |
          POD="$(kubectl get pods \
            -n "$K8S_NAMESPACE" \
            -l app="$SERVICE_NAME" \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')"

          test -n "$POD"

          kubectl exec \
            -n "$K8S_NAMESPACE" \
            "$POD" \
            -- wget -qO- \
            "http://127.0.0.1:${SERVICE_PORT}/actuator/health" \
            | grep -q '"status":"UP"'

          echo "Shipping Service health: UP"

      # Final traceability of what was deployed
      - name: Deployment summary
        run: |
          echo "Shipping Service deployed successfully"
          echo "Version : $APP_VERSION"
          echo "JAR     : $JAR_NAME"
          echo "Image   : $IMAGE_URI"
          echo "Digest  : $IMAGE_DIGEST"
          echo "Helm    : $HELM_RELEASE"