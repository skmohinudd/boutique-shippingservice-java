spring:
  application: {name: shippingservice}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate: {ddl-auto: validate}
    open-in-view: false
  flyway: {enabled: true}
server: {port: "${SERVER_PORT:8087}", shutdown: graceful}
management:
  endpoints:
    web:
      exposure: {include: health,info}

spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id: ${KAFKA_CONSUMER_GROUP:shipping-service}
spring.kafka.consumer.auto-offset-reset: earliest
app.kafka.order-events-topic: ${KAFKA_ORDER_EVENTS_TOPIC:boutique.order.events}
app.kafka.shipping-events-topic: ${KAFKA_SHIPPING_EVENTS_TOPIC:boutique.shipping.events}
